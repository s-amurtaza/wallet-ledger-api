
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      APP_ENV: production
      APP_DEBUG: "false"

      API_TOKEN: ${API_TOKEN:-recruitment-test-token}

      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_DATABASE: wallet_ledger
      DB_USERNAME: root
      DB_PASSWORD: ""

    command: >
      sh -c "php artisan config:clear &&
      php artisan migrate --force &&
      php artisan serve --host=0.0.0.0 --port=8080"

    restart: unless-stopped
